<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>血染钟楼 AI 对战排行榜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0e12;
      --surface: #16161e;
      --surface2: #1e1e2a;
      --border: #2a2a3a;
      --border-light: #3a3a4a;
      --text: #e0ddd4;
      --muted: #8a8a9a;
      --blood: #8b0000;
      --blood-light: #b22222;
      --gold: #c9a84c;
      --green: #28a060;
      --blue: #4a90d9;
      --purple: #9b59b6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans SC", sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container { max-width: 1500px; margin: 0 auto; }

    /* Header */
    header { text-align: center; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    h1 { font-family: "Cinzel", serif; font-size: 2.2rem; color: var(--blood-light); margin-bottom: 6px; letter-spacing: 2px; }
    .subtitle { color: var(--muted); font-size: 0.95rem; }

    /* Summary cards */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 10px;
      text-align: center;
    }
    .card .card-value { font-size: 1.5rem; font-weight: 700; margin-bottom: 2px; }
    .card .card-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .card.gold .card-value { color: var(--gold); }
    .card.blood .card-value { color: var(--blood-light); }
    .card.green .card-value { color: var(--green); }
    .card.blue .card-value { color: var(--blue); }

    /* Tab nav */
    .tab-nav {
      display: flex; gap: 2px; margin-bottom: 16px;
      border-bottom: 2px solid var(--border); overflow-x: auto;
    }
    .tab-btn {
      background: none; border: none; color: var(--muted);
      font-family: inherit; font-size: 0.85rem;
      padding: 10px 16px; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: all 0.2s; white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Tables */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 9px 12px; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th {
      background: var(--surface); color: var(--gold); font-weight: 600;
      cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 2;
    }
    th:hover { color: var(--text); }
    th .arrow { font-size: 0.65em; margin-left: 3px; }
    td:first-child, th:first-child { text-align: center; }
    td:nth-child(2), th:nth-child(2) { text-align: left; }
    tr:hover td { background: rgba(139, 0, 0, 0.06); }
    .rank { font-weight: 700; color: var(--gold); }
    .rank-1 { color: #ffd700; font-size: 1.05em; }
    .rank-2 { color: #c0c0c0; }
    .rank-3 { color: #cd7f32; }
    .model-name { font-weight: 500; text-align: left !important; }
    .rate { font-variant-numeric: tabular-nums; }
    .cost { color: var(--muted); font-variant-numeric: tabular-nums; }
    .good-col { color: var(--green); }
    .evil-col { color: var(--blood-light); }

    /* Rate bar */
    .rate-cell { position: relative; }
    .rate-bar {
      position: absolute; left: 0; top: 0; bottom: 0;
      border-radius: 2px; opacity: 0.12; z-index: 0;
    }
    .rate-cell .rate-val { position: relative; z-index: 1; }

    /* ── H2H Matrix ── */
    .h2h-table { border-collapse: collapse; font-size: 0.78rem; margin: 0 auto; }
    .h2h-table th, .h2h-table td {
      padding: 5px 4px; text-align: center;
      border: 1px solid var(--border); min-width: 64px;
    }
    .h2h-table .h2h-corner { background: var(--surface); }
    .h2h-table .h2h-row-label {
      text-align: right; font-weight: 500; padding-right: 10px;
      position: sticky; left: 0; background: var(--bg); z-index: 3; min-width: 130px;
    }
    .h2h-table .h2h-col-label {
      writing-mode: vertical-rl; text-orientation: mixed;
      font-weight: 500; height: 120px; vertical-align: bottom;
      background: var(--bg);
    }
    .h2h-table .h2h-self { background: var(--surface2); color: var(--muted); }
    .h2h-cell { font-variant-numeric: tabular-nums; cursor: default; position: relative; }
    .h2h-cell .h2h-sub { display: block; font-size: 0.65rem; color: var(--muted); margin-top: 1px; }
    .h2h-legend {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin: 12px 0 8px; font-size: 0.8rem; color: var(--muted);
    }
    .h2h-legend-bar {
      display: inline-block; width: 120px; height: 14px; border-radius: 3px;
      background: linear-gradient(to right, #5a2020, #3a3020, #205a30);
    }

    /* ── Role Stats ── */
    .role-section { margin-bottom: 28px; }
    .role-cat-header {
      font-size: 1.05rem; font-weight: 600; margin-bottom: 12px;
      padding: 8px 14px; border-radius: 6px;
    }
    .role-cat-header.demon { background: rgba(178,34,34,0.12); color: var(--blood-light); border-left: 3px solid var(--blood-light); }
    .role-cat-header.minion { background: rgba(155,89,182,0.12); color: var(--purple); border-left: 3px solid var(--purple); }
    .role-cat-header.townsfolk { background: rgba(40,160,96,0.10); color: var(--green); border-left: 3px solid var(--green); }
    .role-cat-header.outsider { background: rgba(74,144,217,0.10); color: var(--blue); border-left: 3px solid var(--blue); }
    .role-block { margin-bottom: 18px; margin-left: 12px; }
    .role-block-title {
      font-size: 0.92rem; font-weight: 500; margin-bottom: 6px;
      color: var(--text); display: flex; align-items: center; gap: 10px;
    }
    .role-block-title .role-meta { font-size: 0.78rem; color: var(--muted); font-weight: 400; }
    .role-table { width: auto; min-width: 500px; }
    .role-table th { font-size: 0.78rem; padding: 6px 10px; }
    .role-table td { font-size: 0.82rem; padding: 6px 10px; }

    /* Footer */
    footer {
      text-align: center; margin-top: 28px; padding-top: 16px;
      border-top: 1px solid var(--border); color: var(--muted);
      font-size: 0.82rem; line-height: 1.8;
    }
    footer a { color: var(--blood-light); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    #loading { text-align: center; padding: 40px; color: var(--muted); }
    #error { text-align: center; padding: 40px; color: var(--blood-light); display: none; }

    @media (max-width: 768px) {
      h1 { font-size: 1.5rem; }
      .summary-cards { grid-template-columns: repeat(2, 1fr); }
      th, td { padding: 7px 6px; font-size: 0.78rem; }
      .tab-btn { padding: 8px 10px; font-size: 0.8rem; }
    }
  </style>
</head>

    function load() {
      init();
    }

    function init() {
      document.getElementById("loading").style.display = "none";
      document.getElementById("mainContent").style.display = "";
      renderSummary();
      for (const tab of Object.keys(tabDefs)) renderTab(tab);
      renderH2H();
      renderRoleStats();
      bindTabs();
    }

    /* ── summary cards ── */
    function renderSummary() {
      const c = document.getElementById("summaryCards");
      const top = data.models[0];
      const gs = data.globalStats || {};
      const n = data.models.length;

      const cards = [
        { label: "总局数", value: data.totalGames, cls: "gold" },
        { label: "参赛模型", value: n, cls: "blue" },
        { label: "善良阵营胜场", value: `${gs.goodGameWins || 0}/${gs.totalGames || 60}`, cls: "green" },
        { label: "邪恶阵营胜场", value: `${gs.evilGameWins || 0}/${gs.totalGames || 60}`, cls: "blood" },
        { label: "善良局胜率", value: pct(gs.goodGameWinRate), cls: "green" },
        { label: "邪恶局胜率", value: pct(gs.evilGameWinRate), cls: "blood" },
        { label: "模型平均胜率", value: pct(gs.avgModelWinRate), cls: "gold" },
        { label: "冠军模型", value: top ? top.label : "—", cls: "gold" },
        { label: "最高胜率", value: top ? pct(top.overallWinRate) : "—", cls: "gold" },
        { label: "总花费", value: dollar(data.totalCost), cls: "blue" },
      ];

      c.innerHTML = cards.map(cd =>
        `<div class="card ${cd.cls}"><div class="card-value">${cd.value}</div><div class="card-label">${cd.label}</div></div>`
      ).join("");
    }

    /* ── render sortable tab table ── */
    function renderTab(tab) {
      const def = tabDefs[tab];
      const state = tabState[tab];
      const cols = def.cols;

      const models = data.models.slice().sort((a, b) => {
        let va = a[state.sortKey], vb = b[state.sortKey];
        if (va == null) va = -Infinity;
        if (vb == null) vb = -Infinity;
        if (typeof va === "string") return state.sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        return state.sortAsc ? va - vb : vb - va;
      });
      models.forEach((m, i) => m.rank = i + 1);

      const barCol = cols.find(c => c.bar);
      let barMax = barCol ? Math.max(...models.map(m => m[barCol.key] || 0), 0.01) : 1;

      const thead = document.getElementById("thead-" + tab);
      thead.innerHTML = "<tr>" + cols.map(c => {
        const arrow = c.key === state.sortKey ? (state.sortAsc ? " ▲" : " ▼") : "";
        return `<th data-key="${c.key}" data-tab="${tab}">${c.label}<span class="arrow">${arrow}</span></th>`;
      }).join("") + "</tr>";
      thead.querySelectorAll("th").forEach(th => {
        if (cols.find(c => c.key === th.dataset.key)?.noSort) return;
        th.addEventListener("click", () => {
          const key = th.dataset.key;
          if (key === state.sortKey) state.sortAsc = !state.sortAsc;
          else { state.sortKey = key; state.sortAsc = false; }
          renderTab(tab);
        });
      });

      const tbody = document.getElementById("tbody-" + tab);
      tbody.innerHTML = models.map(m => {
        return "<tr>" + cols.map(c => {
          let cls = c.cls || "";
          if (c.key === "rank") cls = `rank${m.rank <= 3 ? " rank-" + m.rank : ""}`;
          if (c.key === "label") cls = "model-name";
          const val = c.fmt(m[c.key]);
          if (c.bar && m[c.key] != null) {
            const w = Math.max(0, Math.min(100, (m[c.key] / barMax) * 100));
            return `<td class="rate-cell ${cls}"><div class="rate-bar" style="width:${w}%;background:${c.barColor}"></div><span class="rate-val">${val}</span></td>`;
          }
          return `<td class="${cls}">${val}</td>`;
        }).join("") + "</tr>";
      }).join("");
    }

    /* ── H2H Matrix ── */
    function renderH2H() {
      const h2h = data.h2h;
      if (!h2h) return;
      const wrap = document.getElementById("h2h-wrap");
      const models = h2h.models;
      const labels = h2h.labels;
      const matrix = h2h.matrix;

      // Color interpolation: winRate 0→red, 0.5→neutral, 1→green
      function cellColor(wr) {
        if (wr == null) return "transparent";
        // hue: 0(red) to 120(green), saturation varies
        const h = wr * 120;
        const s = 30 + Math.abs(wr - 0.5) * 60;  // more saturated at extremes
        const l = 18 + Math.abs(wr - 0.5) * 12;
        return `hsl(${h}, ${s}%, ${l}%)`;
      }

      let html = '';
      html += '<div class="h2h-legend">';
      html += '<span>劣势</span>';
      html += '<div class="h2h-legend-bar"></div>';
      html += '<span>优势</span>';
      html += '<span style="margin-left:20px;font-size:0.75rem">单元格: 行模型 vs 列模型 (胜场/总对局)</span>';
      html += '</div>';
      html += '<table class="h2h-table"><thead><tr>';
      html += '<th class="h2h-corner"></th>';
      for (let j = 0; j < models.length; j++) {
        html += `<th class="h2h-col-label">${labels[j]}</th>`;
      }
      html += '</tr></thead><tbody>';

      for (let i = 0; i < models.length; i++) {
        html += '<tr>';
        html += `<td class="h2h-row-label">${labels[i]}</td>`;
        for (let j = 0; j < models.length; j++) {
          if (i === j) {
            html += '<td class="h2h-self">—</td>';
            continue;
          }
          const a = models[i], b = models[j];
          const cell = matrix[a] && matrix[a][b];
          if (!cell || cell.encounters === 0) {
            html += '<td class="h2h-cell" style="color:var(--muted)">—</td>';
            continue;
          }
          const wr = cell.winRate;
          const bg = cellColor(wr);
          const wrPct = (wr * 100).toFixed(0) + "%";
          html += `<td class="h2h-cell" style="background:${bg}" title="${labels[i]} vs ${labels[j]}: ${cell.wins}胜/${cell.encounters}局 (${wrPct})">`;
          html += `${cell.wins}/${cell.encounters}`;
          html += `<span class="h2h-sub">${wrPct}</span>`;
          html += '</td>';
        }
        html += '</tr>';
      }

      html += '</tbody></table>';
      wrap.innerHTML = html;
    }

    /* ── Role Stats ── */
    function renderRoleStats() {
      const rs = data.roleStats;
      if (!rs) return;
      const wrap = document.getElementById("roles-wrap");

      const catColors = {
        demon: "evil-col",
        minion: "evil-col",
        townsfolk: "good-col",
        outsider: "good-col",
      };

      let html = '';
      for (const cat of rs.categories) {
        html += `<div class="role-section">`;
        html += `<div class="role-cat-header ${cat.name}">${cat.label}</div>`;

        for (const role of cat.roles) {
          const roleTotalWR = role.totalGames > 0 ? ((role.totalWins / role.totalGames) * 100).toFixed(1) + "%" : "N/A";
          html += '<div class="role-block">';
          html += `<div class="role-block-title">${role.role} <span class="role-meta">${role.totalGames}局 | ${role.totalWins}胜 | 整体胜率 ${roleTotalWR}</span></div>`;
          html += '<div class="table-wrap"><table class="role-table"><thead><tr>';
          html += '<th>#</th><th>模型</th><th>局数</th><th>胜场</th><th>胜率</th>';
          html += '</tr></thead><tbody>';

          role.models.forEach((m, idx) => {
            const wr = (m.winRate * 100).toFixed(1) + "%";
            const cls = catColors[cat.name] || "";
            html += '<tr>';
            html += `<td class="rank${idx < 3 ? " rank-" + (idx+1) : ""}">${idx + 1}</td>`;
            html += `<td class="model-name">${m.label}</td>`;
            html += `<td>${m.games}</td>`;
            html += `<td>${m.wins}</td>`;
            html += `<td class="${cls}" style="font-weight:600">${wr}</td>`;
            html += '</tr>';
          });

          html += '</tbody></table></div></div>';
        }
        html += '</div>';
      }
      wrap.innerHTML = html;
    }

    /* ── tab switching ── */
    function bindTabs() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
        });
      });
    }

    load();
  })();
  </script>
</body>
</html>
